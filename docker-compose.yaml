services:
    postgres:
        image: postgres:16
        container_name: my-postgres
        restart: unless-stopped

        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: myapp

        ports:
            - "5432:5432"

        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
